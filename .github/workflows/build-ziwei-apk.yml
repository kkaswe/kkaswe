name: Build Ziwei DeepSeek Android APK
on:
  push:
    branches: [ziwei-deepseek-android-build]
    paths:
      - source-payload.tar.xz
      - .github/workflows/build-ziwei-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: mkdir -p build-project && tar -xJf source-payload.tar.xz -C build-project
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install npm dependencies
        working-directory: build-project
        run: npm install --no-audit --no-fund
      - name: Synchronize verified upstream engine
        working-directory: build-project
        run: npm run sync:upstream
      - name: Build local web and Android assets
        working-directory: build-project
        run: npm run build:web && npm run stage:android
      - name: Compile APK
        working-directory: build-project
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZiweiDeepSeek-debug-apk
          path: build-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
